<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Girðingareiknivél v13 – Byko Leiga</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap');
:root{--color-border:#ddd;--color-surface:#fafafa;--color-bg:#f2f4f7;--color-muted:#666;--color-dark:#404042;--color-accent:#f5c800;--radius-sm:5px;--radius-md:8px;--radius-lg:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',system-ui,Arial,sans-serif;background:var(--color-bg);margin:0;padding:20px}
.calculator{max-width:640px;margin:auto;background:#fff;padding:20px;border-radius:var(--radius-lg);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.calc-header{display:flex;align-items:center;justify-content:space-between;margin:-20px -20px 20px -20px;padding:22px 28px;background:var(--color-dark);border-radius:var(--radius-lg) var(--radius-lg) 0 0;position:relative;overflow:hidden}
.calc-header::before{content:'';position:absolute;top:0;left:0;width:6px;height:100%;background:var(--color-accent)}
.calc-header::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.calc-header-left{position:relative;z-index:1}
.calc-header-eyebrow{font-family:'Barlow',system-ui,sans-serif;font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:var(--color-accent);margin-bottom:4px}
.calc-header h2{margin:0;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:30px;font-weight:700;color:#fff;letter-spacing:.5px;line-height:1}
.calc-header-sub{font-family:'Barlow',system-ui,sans-serif;font-size:12px;color:rgba(255,255,255,.45);margin-top:5px;letter-spacing:.5px}
.print-header-title{display:none;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:#fff;line-height:1}
.calc-body{padding:8px 8px 12px}
.section-label{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--color-muted);margin-bottom:10px}
/* Fence type tabs */
.fence-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.fence-tab{padding:14px 10px;border:2px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;color:var(--color-muted);line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:6px}
.fence-tab .tab-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;display:block;color:#333}
.fence-tab .tab-sub{font-size:11px;font-weight:500;color:var(--color-muted);letter-spacing:.3px}
.fence-tab.active{border-color:var(--color-dark);background:var(--color-dark)}
.fence-tab.active .tab-name,.fence-tab.active .tab-sub{color:#fff}
.fence-tab.active .tab-sub{color:var(--color-accent)}
/* Option pills */
.option-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.option-tab{padding:8px 18px;border-radius:50px;background:#e8e8e8;border:none;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:#555;text-align:center}
.option-tab.active{background:var(--color-dark);color:#fff}
/* Input mode toggle */
.input-mode-toggle{display:flex;margin-bottom:8px}
.input-mode-toggle button{flex:1;padding:7px 12px;border:1px solid #ccc;background:#e8e8e8;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:#555}
.input-mode-toggle button:first-child{border-radius:50px 0 0 50px;border-right:none}
.input-mode-toggle button:last-child{border-radius:0 50px 50px 0}
.input-mode-toggle button.active{background:var(--color-dark);color:#fff;border-color:var(--color-dark)}
/* Fields */
.field{margin-bottom:18px}
.field>label{display:block;font-size:13px;font-weight:500;color:#444;margin-bottom:7px}
.num-wrap{display:flex;border:1px solid #ccc;border-radius:var(--radius-md);overflow:hidden;background:#fff;transition:border-color .2s}
.num-wrap:focus-within{border-color:var(--color-dark)}
.num-wrap input{flex:1;border:none;padding:11px 14px;font-family:'Barlow',sans-serif;font-size:16px;font-weight:500;outline:none;background:transparent}
.num-arrows{display:flex;flex-direction:column;border-left:1px solid #eee}
.num-arrows button{background:none;border:none;width:36px;height:24px;cursor:pointer;font-size:11px;color:#888;display:flex;align-items:center;justify-content:center;transition:background .15s;padding:0}
.num-arrows button:hover{background:#f5f5f5;color:#333}
.num-arrows button:first-child{border-bottom:1px solid #eee}
.field-hint{font-size:11px;color:var(--color-muted);margin-top:4px}
/* Add button */
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:var(--color-accent);border:none;border-radius:var(--radius-md);font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--color-dark);cursor:pointer;transition:all .2s;letter-spacing:.5px;text-transform:uppercase;margin-bottom:20px}
.add-btn:hover{background:#e6ba00}
/* Quote lines */
.quote-lines{margin-bottom:20px}
.quote-line{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:8px;background:var(--color-surface)}
.quote-line .ql-info{flex:1;min-width:0}
.quote-line .ql-type{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--color-dark)}
.quote-line .ql-detail{font-size:12px;color:var(--color-muted);margin-top:2px}
.quote-line .ql-remove{width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#999;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.quote-line .ql-remove:hover{background:#fee;border-color:#e88;color:#c33}
.ql-items{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.ql-item{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #e0e0e0;border-radius:var(--radius-sm);padding:4px 8px;font-size:12px;color:#555}
.ql-item .ql-item-label{white-space:nowrap}
.ql-item input{width:48px;border:1px solid #ddd;border-radius:4px;padding:3px 5px;font-family:'Barlow',sans-serif;font-size:12px;font-weight:600;text-align:center;outline:none;transition:border-color .2s}
.ql-item input:focus{border-color:var(--color-dark)}
.ql-item .ql-auto{font-size:10px;color:#aaa;margin-left:2px}
.quote-empty{text-align:center;color:#bbb;font-size:13px;padding:12px;border:1px dashed var(--color-border);border-radius:var(--radius-md);margin-bottom:20px}
/* Days row */
.days-row{margin-bottom:18px}
.days-row .field{margin-bottom:0}
/* Note */
.note-box{background:#fffbe6;border:1px solid #f5c800;border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;color:#92400e;margin-bottom:18px;line-height:1.5}
/* Acc grid */
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.acc-item{display:flex;align-items:center;gap:8px}
.acc-item label{font-size:12px;font-weight:500;color:#444;flex:1;min-width:0}
.acc-item .num-wrap{width:100px;flex-shrink:0}
.acc-item .num-wrap input{padding:8px 10px;font-size:14px}
/* Divider */
.divider{height:1px;background:var(--color-border);margin:24px 0}
/* Results */
.result-box{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:8px}
.result-warning{font-size:13px;color:#888;margin-bottom:8px;background:#fffbe6;border:1px solid #f5c800;border-radius:var(--radius-sm);padding:6px 10px}
.result-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:15px;color:#444}
.result-row .r-label{color:var(--color-muted);font-size:13px}
.result-row .r-val{font-weight:600;color:#111}
.result-separator{height:1px;background:var(--color-border);margin:10px 0}
.result-subsection-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--color-muted);margin:12px 0 6px}
.result-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:10px;border-top:2px solid var(--color-dark)}
.result-total .rt-label{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--color-dark)}
.result-total .rt-value{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:var(--color-dark);letter-spacing:.5px}
.result-empty{font-size:14px;color:#bbb;text-align:center;padding:10px 0}
/* Mat table */
.mat-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0 6px}
.mat-table th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--color-muted);padding:6px 8px;border-bottom:2px solid var(--color-dark)}
.mat-table th:last-child,.mat-table td:last-child{text-align:right}
.mat-table td{padding:7px 8px;border-bottom:1px solid #eee;color:#333}
.mat-table tr:last-child td{border-bottom:none}
.mat-table .mat-group-header td{font-weight:700;color:var(--color-dark);background:#f5f5f5;font-size:12px;letter-spacing:.5px}
/* Tooltip */
.tooltip-wrap{position:relative;display:inline-flex;align-items:center;gap:5px}
.tooltip-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#e0e0e0;color:var(--color-dark);font-size:10px;font-weight:700;cursor:pointer;margin-left:5px;flex-shrink:0}
.tooltip-bubble{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1e293b;color:#f8fafc;font-size:12px;font-weight:400;line-height:1.5;padding:10px 14px;border-radius:var(--radius-md);width:260px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.25);pointer-events:none;text-transform:none;letter-spacing:0}
.tooltip-bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1e293b}
.tooltip-wrap:hover .tooltip-bubble,.tooltip-wrap:focus-within .tooltip-bubble{display:block}
/* Breakdown */
.breakdown-panel{display:none;margin:8px 0 4px;overflow-x:auto}
.breakdown-panel.open{display:block}
.bd-table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.bd-table th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#fff;background:var(--color-dark);padding:6px 8px;white-space:nowrap}
.bd-table th:not(:first-child){text-align:right}
.bd-table td{padding:5px 8px;border-bottom:1px solid #eee;color:#555;white-space:nowrap}
.bd-table td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.bd-table tr:last-child td{border-bottom:none}
.bd-table .bd-total td{font-weight:700;color:var(--color-dark);border-top:2px solid var(--color-dark);border-bottom:none}
.bd-table .bd-rate{color:#999;font-size:11px}
/* Print button */
.print-only-label{display:none}
.print-btn{display:inline-flex;align-items:center;gap:8px;margin:16px 0 4px;padding:10px 22px;background:var(--color-dark);border:none;border-radius:var(--radius-md);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#fff;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-transform:uppercase}
.print-btn:hover{background:#2a2a2c}
/* Print */
@page{size:A4 portrait;margin:10mm 12mm}
@media print{
  body{background:#fff;padding:0;margin:0}
  .calculator{box-shadow:none;max-width:100%;padding:6px 12px;border-radius:0}
  .calc-header{background:#404042!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:14px 20px;margin:-6px -12px 12px -12px;border-radius:0}
  .calc-header h2,.calc-header-sub{display:none}
  .calc-header-eyebrow{margin-bottom:0}
  .print-header-title{display:block!important}
  .no-print{display:none!important}
  .quote-line{border-color:#ddd;margin-bottom:4px;padding:6px 10px}
  .ql-type{font-size:13px}
  .ql-detail{font-size:11px}
  .result-box{border:none;background:none;padding:0}
  .breakdown-panel{display:block!important;overflow:visible}
  .print-only-label{display:block!important}
  .bd-table{font-size:9px;margin:4px 0}
  .bd-table th{background:#404042!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:4px 5px;font-size:8px;letter-spacing:.3px}
  .bd-table td{padding:3px 5px;font-size:9px}
  .bd-rate{display:none!important}
  .mat-table{font-size:11px}
  .mat-table th{border-bottom:2px solid #404042!important;padding:5px 6px}
  .mat-table td{padding:5px 6px}
  .mat-table .mat-group-header td{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .result-total{border-top:2px solid #404042!important}
  .result-total .rt-value{font-size:26px}
  .result-row{font-size:13px;padding:2px 0}
  .result-subsection-label{font-size:10px;margin:8px 0 4px}
}
@media(max-width:500px){.fence-tabs{grid-template-columns:1fr}.acc-grid{grid-template-columns:1fr}.result-total .rt-value{font-size:26px}}
</style>
</head>
<body>
<div class="calculator">
  <div class="calc-header">
    <div class="calc-header-left">
      <div class="calc-header-eyebrow">Byko Leiga</div>
      <h2>Girðingareiknivél</h2>
      <span class="print-header-title">Tilboð - leiga á girðingum</span>
      <div class="calc-header-sub">Iðnaðargirðingar — verðútreikningur</div>
    </div>
  </div>
  <div class="calc-body">

    <!-- CONFIGURATOR (no-print) -->
    <div class="no-print">
      <div class="section-label">Tegund girðingar</div>
      <div class="fence-tabs">
        <button class="fence-tab active" onclick="selectFenceType('standard',this)"><span class="tab-name">Girðingar 3,5m</span><span class="tab-sub">Vinnustaðagirðingar</span></button>
        <button class="fence-tab" onclick="selectFenceType('queue',this)"><span class="tab-name">Biðraðagirðingar</span><span class="tab-sub">2,5m</span></button>
        <button class="fence-tab" onclick="selectFenceType('plastic',this)"><span class="tab-name">Plastgirðingar</span><span class="tab-sub">2,1m</span></button>
        <button class="fence-tab" onclick="selectFenceType('warning',this)"><span class="tab-name">Gátaskjöldur</span><span class="tab-sub">1,3m</span></button>
      </div>
      <div id="heightSection">
        <div class="section-label">Hæð girðingar</div>
        <div class="option-tabs" id="heightTabs">
          <button class="option-tab active" onclick="selectHeight('2.0',this)">2,0 m</button>
          <button class="option-tab" onclick="selectHeight('1.2',this)">1,2 m</button>
        </div>
      </div>
      <div id="stoneSection">
        <div class="section-label">Tegund steina</div>
        <div class="option-tabs" id="stoneTabs">
          <button class="option-tab active" onclick="selectStoneType('concrete',this)">Steyptir steinar</button>
          <button class="option-tab" onclick="selectStoneType('pvc',this)">PVC steinar</button>
        </div>
      </div>
      <div id="lengthSection">
        <div class="field">
          <div class="input-mode-toggle" id="inputModeToggle">
            <button class="active" onclick="setInputMode('meters',this)">Metrar</button>
            <button onclick="setInputMode('panels',this)">Fjöldi girðinga</button>
          </div>
          <label id="lengthLabel">Heildar lengd girðingar (metrar)</label>
          <div class="num-wrap">
            <input type="text" inputmode="decimal" id="lengthInput" value="" placeholder="0" oninput="">
            <div class="num-arrows"><button onclick="stepField('lengthInput',1,getStep())">&#9650;</button><button onclick="stepField('lengthInput',-1,getStep())">&#9660;</button></div>
          </div>
        </div>
      </div>

      <button class="add-btn" onclick="addLine()">+ Bæta við tilboð</button>
    </div>

    <!-- QUOTE LINES -->
    <div id="quoteLines"></div>

    <!-- DAYS + ACCESSORIES (shared) -->
    <div id="sharedSection" style="display:none">
      <div class="divider no-print"></div>

      <div class="days-row">
        <div class="field">
          <label>Leigutími (dagar)</label>
          <div class="num-wrap">
            <input type="text" inputmode="numeric" id="rentalDays" value="30" oninput="calculate()">
            <div class="num-arrows"><button onclick="stepField('rentalDays',1,1)">&#9650;</button><button onclick="stepField('rentalDays',-1,1)">&#9660;</button></div>
          </div>
          <div class="field-hint">Lágmark: 10 dagar</div>
        </div>
      </div>

      <div class="note-box">Leiguverð lækkar sjálfkrafa eftir leigutíma. Sjá nánar í <em>sundurliðun eftir tímabilum</em>.</div>

      <div id="accSection">
        <div class="section-label no-print">Aukahlutir</div>
        <div class="acc-grid no-print">
          <div class="acc-item" id="accGate"><label>Gönguhlið (stk)</label><div class="num-wrap"><input type="text" inputmode="numeric" id="gateQty" value="0" oninput="calculate()"><div class="num-arrows"><button onclick="stepField('gateQty',1,1)">&#9650;</button><button onclick="stepField('gateQty',-1,1)">&#9660;</button></div></div></div>
          <div class="acc-item" id="accWheels"><label>Hjól f/girðingar (stk)</label><div class="num-wrap"><input type="text" inputmode="numeric" id="wheelsQty" value="0" oninput="calculate()"><div class="num-arrows"><button onclick="stepField('wheelsQty',1,1)">&#9650;</button><button onclick="stepField('wheelsQty',-1,1)">&#9660;</button></div></div></div>
          <div class="acc-item" id="accLock"><label>Efri læsing f/hlið (stk)</label><div class="num-wrap"><input type="text" inputmode="numeric" id="lockQty" value="0" oninput="calculate()"><div class="num-arrows"><button onclick="stepField('lockQty',1,1)">&#9650;</button><button onclick="stepField('lockQty',-1,1)">&#9660;</button></div></div></div>
          <div class="acc-item" id="accSign"><label>Gátaskjöldur (stk)</label><div class="num-wrap"><input type="text" inputmode="numeric" id="signQty" value="0" oninput="calculate()"><div class="num-arrows"><button onclick="stepField('signQty',1,1)">&#9650;</button><button onclick="stepField('signQty',-1,1)">&#9660;</button></div></div></div>
        </div>
      </div>

      <div class="divider"></div>
      <div id="resultBox"><div class="result-empty">Fylltu inn upplýsingar til að sjá verðtilboð.</div></div>
    </div>

  </div>
</div>

<script>
var currentFenceType="standard",currentHeight="2.0",currentStoneType="concrete",inputMode="meters",MIN_DAYS=10;
var quoteLines=[];
var lineIdCounter=0;

var PRODUCTS={
  "fence-3500x2000x1.1":{rentalNo:"01-BAT-GI01-015",saleNo:"0295300",desc:"Girðingar 3,5x2m",rates:[100,50,25,13,13,13,13,13,13,13,13,13],salePrice:19995},
  "fence-3500x2000x1.7":{rentalNo:"01-BAT-GI01-053",saleNo:"0295317",desc:"Girðingar 3,5x2m",rates:[100,50,25,13,13,13,13,13,13,13,13,13],salePrice:24995},
  "fence-3500x1200x1.1":{rentalNo:"01-BAT-GI01-052",saleNo:"0295290",desc:"Girðingar 3,5x1,2m",rates:[80,40,20,10,10,10,10,10,10,10,10,10],salePrice:12995},
  "queue-barrier":{rentalNo:"01-BAT-GI01-050",saleNo:"0295292",desc:"Biðraðagirðingar 2,5x1,1m",rates:[130,65,33,16,16,16,16,16,16,16,16,16],salePrice:24995},
  "plastic-fence":{rentalNo:"01-BAT-GI01-043",saleNo:"0295243",desc:"Girðing plast 2,1x1,1m",rates:[80,40,20,10,10,10,10,10,10,10,10,10],salePrice:26995},
  "stone-concrete":{rentalNo:"01-BAT-GI01-054",saleNo:"0295320",desc:"Steinar f/girðingar",rates:[20,10,5,3,3,3,3,3,3,3,3,3],salePrice:2495},
  "stone-pvc":{rentalNo:"01-BAT-GI01-0541",saleNo:"0295325",desc:"PVC Steinar f/girðingar",rates:[50,25,13,6,6,6,6,6,6,6,6,6],salePrice:3995},
  "clamps":{rentalNo:"01-BAT-GI01-097",saleNo:"97100097",desc:"Klemmur f/girðingar",rates:[2,2,2,2,2,2,2,2,2,2,2,2],salePrice:995},
  "rack-fence":{rentalNo:"01-BAT-GI01-100",saleNo:"97100100",desc:"Rekki f/girðingar (25stk)",rates:[100,100,100,100,100,100,100,100,100,100,100,100],salePrice:99995},
  "rack-queue":{rentalNo:"01-BAT-GI01-051",saleNo:"97310020",desc:"Rekki f/biðraðagirðingar (15stk)",rates:[64,64,64,64,64,64,64,64,64,64,64,64],salePrice:84995},
  "walking-gate":{rentalNo:"01-BAT-GI01-096",saleNo:"97100096",desc:"Gönguhlið 1,2m",rates:[100,50,25,13,13,13,13,13,13,13,13,13],salePrice:20312},
  "wheels":{rentalNo:"01-BAT-GI01-099",saleNo:"97100099",desc:"Hjól f/girðingar",rates:[110,55,28,14,14,14,14,14,14,14,14,14],salePrice:18395},
  "lock":{rentalNo:"01-BAT-GI01-101",saleNo:"971000981",desc:"Efri læsing f/hlið",rates:[50,25,13,6,6,6,6,6,6,6,6,6],salePrice:4858},
  "warning-sign":{rentalNo:"01-BAT-GI01-045",saleNo:"0295245",desc:"Gátaskjöldur 1,3x0,31m",rates:[40,20,10,5,5,5,5,5,5,5,5,5],salePrice:9995}
};

var FENCE_TYPES={
  standard:{name:"Vinnustaðagirðingar",unitLength:3.5},
  queue:{name:"Biðraðagirðingar",unitLength:2.5},
  plastic:{name:"Plastgirðingar",unitLength:2.1},
  warning:{name:"Gátaskjöldur",unitLength:1.0}
};

function fmtNum(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function fmtDec(n,d){return n.toFixed(d).replace(".",",")}
function parseVal(s){if(!s)return 0;return parseFloat(String(s).replace(/,/g,"."))||0}
function calcRentalCost(days,rates,qty){var t=0,r=days;for(var i=0;i<12;i++){if(r<=0)break;var pd=Math.min(r,30);t+=pd*rates[i]*qty;r-=pd}return t}

function selectFenceType(type,btn){currentFenceType=type;document.querySelectorAll(".fence-tab").forEach(function(b){b.classList.remove("active")});btn.classList.add("active");updateConfig()}
function selectHeight(h,btn){currentHeight=h;btn.closest(".option-tabs").querySelectorAll(".option-tab").forEach(function(b){b.classList.remove("active")});btn.classList.add("active")}
function selectStoneType(s,btn){currentStoneType=s;btn.closest(".option-tabs").querySelectorAll(".option-tab").forEach(function(b){b.classList.remove("active")});btn.classList.add("active")}
function setInputMode(mode,btn){inputMode=mode;document.getElementById("lengthInput").value="";btn.closest(".input-mode-toggle").querySelectorAll("button").forEach(function(b){b.classList.remove("active")});btn.classList.add("active");updateConfig()}
function getStep(){return inputMode==="panels"?1:0.5}
function stepField(id,dir,step){var el=document.getElementById(id);var v=parseVal(el.value);var nv=Math.max(0,Math.round((v+dir*step)*10)/10);el.value=step>=1?Math.round(nv):fmtDec(nv,1);if(id==="rentalDays"||id==="gateQty"||id==="wheelsQty"||id==="lockQty"||id==="signQty")calculate()}

function updateConfig(){
  var ft=currentFenceType;
  var s=function(id,v){document.getElementById(id).style.display=v?"":"none"};
  s("heightSection",ft==="standard");
  s("stoneSection",ft==="standard"||ft==="plastic");
  var toggle=document.getElementById("inputModeToggle");
  if(ft==="warning"){
    document.getElementById("lengthLabel").textContent="Fjöldi gátaskjalda (stk)";
    toggle.style.display="none";
  }else{
    toggle.style.display="flex";
    document.getElementById("lengthLabel").textContent=inputMode==="panels"?"Fjöldi girðinga (stk)":"Heildar lengd girðingar (metrar)";
  }
}

/* === Line management === */
function resolveLineItems(ft,height,stoneType,panelCount){
  var items=[];var fenceKey,stoneKey,stoneCount,clampCount,rackKey,rackCount,fenceLength;
  fenceLength=FENCE_TYPES[ft].unitLength;
  if(ft==="standard"){
    fenceKey=height==="2.0"?"fence-3500x2000x1.1":"fence-3500x1200x1.1";
    stoneKey=stoneType==="pvc"?"stone-pvc":"stone-concrete";
    stoneCount=panelCount+1;clampCount=Math.max(0,panelCount-1);
    rackKey="rack-fence";rackCount=Math.ceil(panelCount/25);
  }else if(ft==="queue"){
    fenceKey="queue-barrier";stoneKey=null;stoneCount=0;clampCount=0;
    rackKey="rack-queue";rackCount=Math.ceil(panelCount/15);
  }else if(ft==="plastic"){
    fenceKey="plastic-fence";stoneKey=stoneType==="pvc"?"stone-pvc":"stone-concrete";
    stoneCount=panelCount+1;clampCount=0;rackKey=null;rackCount=0;
  }else{
    fenceKey="warning-sign";stoneKey="stone-pvc";stoneCount=panelCount;
    clampCount=0;rackKey=null;rackCount=0;fenceLength=1;
  }
  function push(key,qty,label){if(qty>0)items.push({key:key,qty:qty,autoQty:qty,label:label})}
  push(fenceKey,panelCount,"Girðingar");
  if(stoneKey&&stoneCount>0)push(stoneKey,stoneCount,"Steinar");
  if(clampCount>0)push("clamps",clampCount,"Klemmur");
  if(rackKey&&rackCount>0)push(rackKey,rackCount,"Rekki");
  return{items:items,actualLength:ft==="warning"?null:panelCount*fenceLength};
}

function addLine(){
  var ft=currentFenceType;
  var inputVal=parseVal(document.getElementById("lengthInput").value);
  if(inputVal<=0){alert("Vinsamlegast fylltu inn magn.");return}
  var fenceLength=FENCE_TYPES[ft].unitLength;
  var panelCount;
  if(ft==="warning"){panelCount=Math.round(inputVal)}
  else if(inputMode==="panels"){panelCount=Math.round(inputVal)}
  else{panelCount=Math.ceil(inputVal/fenceLength)}

  var resolved=resolveLineItems(ft,currentHeight,currentStoneType,panelCount);
  var desc=FENCE_TYPES[ft].name;
  if(ft==="standard")desc+=" "+(currentHeight==="2.0"?"2,0m":"1,2m");

  var line={
    id:++lineIdCounter,
    fenceType:ft,
    desc:desc,
    detail:panelCount+" stk"+(resolved.actualLength!=null?" ("+fmtDec(resolved.actualLength,1)+" m)":""),
    items:resolved.items
  };
  quoteLines.push(line);
  document.getElementById("lengthInput").value="";
  renderLines();
  calculate();
}

function removeLine(id){
  quoteLines=quoteLines.filter(function(l){return l.id!==id});
  renderLines();
  calculate();
}

function updateItemQty(lineId,itemIdx,val){
  for(var i=0;i<quoteLines.length;i++){
    if(quoteLines[i].id===lineId){
      quoteLines[i].items[itemIdx].qty=Math.max(0,parseInt(val)||0);
      break;
    }
  }
  calculate();
}

function renderLines(){
  var container=document.getElementById("quoteLines");
  var shared=document.getElementById("sharedSection");
  if(quoteLines.length===0){
    container.innerHTML='<div class="quote-empty no-print">Engin girðing hefur verið bætt við tilboðið.</div>';
    shared.style.display="none";
    return;
  }
  shared.style.display="";
  var html='<div class="section-label">Tilboðslínur</div>';
  for(var i=0;i<quoteLines.length;i++){
    var l=quoteLines[i];
    html+='<div class="quote-line"><div class="ql-info"><div class="ql-type">'+l.desc+'</div><div class="ql-detail">'+l.detail+'</div>';
    html+='<div class="ql-items no-print">';
    for(var j=0;j<l.items.length;j++){
      var it=l.items[j];
      html+='<div class="ql-item"><span class="ql-item-label">'+it.label+':</span>';
      html+='<input type="number" min="0" value="'+it.qty+'" onchange="updateItemQty('+l.id+','+j+',this.value)">';
      if(it.qty!==it.autoQty)html+='<span class="ql-auto">('+it.autoQty+')</span>';
      html+='</div>';
    }
    html+='</div></div><button class="ql-remove no-print" onclick="removeLine('+l.id+')">&times;</button></div>';
  }
  container.innerHTML=html;
}

function calculate(){
  if(quoteLines.length===0)return;
  var days=parseInt(parseVal(document.getElementById("rentalDays").value))||0;
  var box=document.getElementById("resultBox");
  var minWarning=false;
  if(days<MIN_DAYS&&days>0){minWarning=true;days=MIN_DAYS}
  if(days<=0){box.innerHTML='<div class="result-empty">Fylltu inn leigutíma.</div>';return}

  var gateQty=Math.max(0,parseInt(parseVal(document.getElementById("gateQty").value))||0);
  var wheelsQty=Math.max(0,parseInt(parseVal(document.getElementById("wheelsQty").value))||0);
  var lockQty=Math.max(0,parseInt(parseVal(document.getElementById("lockQty").value))||0);
  var signQty=Math.max(0,parseInt(parseVal(document.getElementById("signQty").value))||0);

  var allItems=[];var totalRental=0;var lineGroups=[];
  for(var li=0;li<quoteLines.length;li++){
    var line=quoteLines[li];var groupItems=[];
    for(var j=0;j<line.items.length;j++){
      var ri=line.items[j];var p=PRODUCTS[ri.key];
      var cost=calcRentalCost(days,p.rates,ri.qty);totalRental+=cost;
      var item={desc:p.desc,qty:ri.qty,cost:cost,rates:p.rates};
      allItems.push(item);groupItems.push(item);
    }
    lineGroups.push({line:line,items:groupItems});
  }
  var accItems=[];
  function addAcc(key,qty){
    if(qty<=0)return;var p=PRODUCTS[key];var cost=calcRentalCost(days,p.rates,qty);
    totalRental+=cost;var item={desc:p.desc,qty:qty,cost:cost,rates:p.rates};
    allItems.push(item);accItems.push(item);
  }
  addAcc("walking-gate",gateQty);addAcc("wheels",wheelsQty);addAcc("lock",lockQty);addAcc("warning-sign",signQty);

  var TIP='<span class="tooltip-wrap"><span class="tooltip-icon">i</span><span class="tooltip-bubble">Verð er áætlað og byggt á gildandi verðskrá (janúar 2026). Endanlegt verð kann að breytast.</span></span>';
  var html='<div class="result-box">';
  if(minWarning)html+='<div class="result-warning">&#9888; Lágmarksleigutími miðar við '+MIN_DAYS+' daga.</div>';
  html+='<div class="result-row"><span class="r-label">Leigutími</span><span class="r-val">'+days+' dagar</span></div>';
  html+='<div class="result-row"><span class="r-label">Tilboðslínur</span><span class="r-val">'+quoteLines.length+'</span></div>';

  html+='<div class="result-subsection-label">Efnislisti</div>';
  html+='<table class="mat-table"><thead><tr><th>Vara</th><th>Magn</th><th>Leiga (samtals)</th></tr></thead><tbody>';
  for(var g=0;g<lineGroups.length;g++){
    var grp=lineGroups[g];
    html+='<tr class="mat-group-header"><td colspan="3">'+grp.line.desc+' — '+grp.line.detail+'</td></tr>';
    for(var j=0;j<grp.items.length;j++){
      var it=grp.items[j];
      html+='<tr><td>'+it.desc+'</td><td>'+it.qty+' stk</td><td>'+fmtNum(it.cost)+' kr</td></tr>';
    }
  }
  if(accItems.length>0){
    html+='<tr class="mat-group-header"><td colspan="3">Aukahlutir</td></tr>';
    for(var j=0;j<accItems.length;j++){
      var it=accItems[j];
      html+='<tr><td>'+it.desc+'</td><td>'+it.qty+' stk</td><td>'+fmtNum(it.cost)+' kr</td></tr>';
    }
  }
  html+='</tbody></table>';
  html+='<div class="result-total"><span class="rt-label">Heildarleiga (með VSK) '+TIP+'</span><span class="rt-value">'+fmtNum(totalRental)+' kr</span></div>';
  html+='<button class="print-btn no-print" onclick="printPDF()">&#9660; Prenta / Vista PDF</button>';

  var numPeriods=Math.ceil(days/30);if(numPeriods>12)numPeriods=12;
  html+='<div class="result-subsection-label no-print" style="margin-top:14px;cursor:pointer" onclick="toggleBreakdown()">Sjá sundurliðun eftir tímabilum <span class="arrow" id="bdArrow" style="font-size:10px">&#9660;</span></div>';
  html+='<div class="result-subsection-label print-only-label" style="margin-top:14px">Hér má sjá sundurliðun eftir tímabilum:</div>';
  html+='<div class="breakdown-panel" id="bdPanel">';
  var CHUNK=6;var numChunks=Math.ceil(numPeriods/CHUNK);
  var dailyTotals=[];var periodCosts=[];
  for(var p=0;p<numPeriods;p++){
    dailyTotals[p]=0;
    for(var i=0;i<allItems.length;i++){dailyTotals[p]+=allItems[i].rates[p]*allItems[i].qty}
    var remaining=days-p*30;var pDays=remaining>0?Math.min(remaining,30):0;
    periodCosts[p]=dailyTotals[p]*pDays;
  }
  for(var c=0;c<numChunks;c++){
    var pFrom=c*CHUNK;var pTo=Math.min(pFrom+CHUNK,numPeriods);
    html+='<table class="bd-table"><thead><tr><th>Vara</th><th>Magn</th>';
    for(var p=pFrom;p<pTo;p++){var pStart=p*30+1;var pEnd=Math.min((p+1)*30,days);html+='<th>Dagar '+pStart+'-'+pEnd+'</th>'}
    html+='</tr></thead><tbody>';
    for(var i=0;i<allItems.length;i++){
      var it=allItems[i];html+='<tr><td>'+it.desc+'</td><td>'+it.qty+'</td>';
      for(var p=pFrom;p<pTo;p++){var dc=it.rates[p]*it.qty;html+='<td>'+fmtNum(dc)+' <span class="bd-rate">('+it.rates[p]+' kr/d)</span></td>'}
      html+='</tr>';
    }
    html+='<tr class="bd-total"><td colspan="2">Samtals dagleiga</td>';
    for(var p=pFrom;p<pTo;p++){html+='<td>'+fmtNum(dailyTotals[p])+' kr</td>'}
    html+='</tr><tr class="bd-total"><td colspan="2">Samt.kostn.pr.mán</td>';
    for(var p=pFrom;p<pTo;p++){html+='<td>'+fmtNum(periodCosts[p])+' kr</td>'}
    html+='</tr><tr class="bd-total"><td colspan="2">Heildarkostnaður</td>';
    var cumBefore=0;for(var pp=0;pp<pFrom;pp++){cumBefore+=periodCosts[pp]}
    for(var p=pFrom;p<pTo;p++){cumBefore+=periodCosts[p];html+='<td>'+fmtNum(cumBefore)+' kr</td>'}
    html+='</tr></tbody></table>';
    if(c<numChunks-1)html+='<div style="height:12px"></div>';
  }
  html+='</div></div>';
  box.innerHTML=html;
}

function toggleBreakdown(){var arrow=document.getElementById("bdArrow");var panel=document.getElementById("bdPanel");if(panel.classList.contains("open")){panel.classList.remove("open");arrow.innerHTML="&#9660;"}else{panel.classList.add("open");arrow.innerHTML="&#9650;"}}
function printPDF(){var panel=document.getElementById("bdPanel");if(panel&&!panel.classList.contains("open")){panel.classList.add("open");var arrow=document.getElementById("bdArrow");if(arrow)arrow.innerHTML="&#9650;"}setTimeout(function(){window.print()},200)}

window.onload=function(){updateConfig();renderLines()};
</script>
</body>
</html>
